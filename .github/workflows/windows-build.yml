name: Windows Build

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "windows-app/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows-app/**"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
        name: TypeScript Check
      - run: npx vitest run
        name: Run Tests

  build:
    name: Build Windows App
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows-app/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri:build
        name: Build Tauri App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            windows-app/src-tauri/target/release/bundle/msi/*.msi
            windows-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
